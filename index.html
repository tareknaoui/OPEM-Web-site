<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Titre et description de l'accueil, présents dès l'ouverture : Google, les aperçus de liens
      et les outils d'IA qui n'exécutent pas le JavaScript les lisent ici. Au démarrage,
      src/main.tsx retire ce <title> pour que chaque page pose le sien (sans doublon). Les garder
      d'accord avec `homeContent.fr.title` (src/features/home/content.ts).
    -->
    <title>OPEM, cabinet de conseil et de formation en Algérie</title>
    <meta
      name="description"
      content="Études, accompagnement, formation qualifiante, coaching, certification et communication : OPEM aide les organisations de toute l’Algérie à exceller."
    />
    <meta name="author" content="OPEM" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OPEM" />
    <meta property="og:locale" content="fr_DZ" />
    <meta property="og:locale:alternate" content="ar_DZ" />
    <meta property="og:title" content="OPEM, cabinet de conseil et de formation en Algérie" />
    <meta
      property="og:description"
      content="Études, accompagnement, formation qualifiante, coaching, certification et communication : OPEM aide les organisations de toute l’Algérie à exceller."
    />
    <!-- Image d'aperçu (LinkedIn, WhatsApp, Facebook…) : adresse absolue, %SITE_URL% est
         remplacé au build (vite.seo.ts). -->
    <meta property="og:image" content="%SITE_URL%/images/partage/opem-partage.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo OPEM, Beyond Quality" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Fiche d'identité pour Google (données structurées schema.org) : nom, coordonnées,
         adresse. Coordonnées identiques à src/config/company.ts (à garder synchronisées). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "OPEM",
        "alternateName": "Optimum Performance Management",
        "slogan": "Beyond Quality",
        "description": "Cabinet de conseil et de formation : études stratégiques, accompagnement des organisations, formation qualifiante, coaching, certification et communication institutionnelle.",
        "url": "%SITE_URL%/",
        "logo": "%SITE_URL%/logo-opem-couleur.svg",
        "image": "%SITE_URL%/images/partage/opem-partage.png",
        "foundingDate": "2019",
        "telephone": "+213661119423",
        "email": "general@opem-dz.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "16, rue La Bruyère",
          "addressLocality": "Bouzaréah",
          "addressRegion": "Alger",
          "addressCountry": "DZ"
        },
        "areaServed": { "@type": "Country", "name": "Algérie" },
        "knowsLanguage": ["fr", "ar"]
      }
    </script>
  </head>
  <body>
    <noscript>Ce site nécessite JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
