; Réglages PHP pour les formulaires d'OPEM (candidatures avec CV et documents).
; À copier dans /etc/php/8.3/fpm/conf.d/99-opem.ini, puis : sudo systemctl restart php8.3-fpm
upload_max_filesize = 10M
post_max_size = 64M
max_file_uploads = 10
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
; Ne pas annoncer la version de PHP.
expose_php = Off
