# ==========================================================================
# OPEM : site React + WordPress (dans /cms) sur un même serveur Nginx.
#
# À copier dans /etc/nginx/sites-available/opem.conf (voir deploy/README.md, étape 6).
# Remplacer « opem-dz.com » par le domaine définitif s'il change (5 endroits).
#
# Équivalent de vercel.json pour un VPS : mêmes en-têtes de sécurité, mêmes redirections,
# même cache, adresses sans « .html » (cleanUrls) et retour vers l'application pour les
# autres adresses (SPA).
#
# Dossiers sur le serveur :
#   /var/www/opem/site/current      le site construit (lien vers la dernière version envoyée)
#   /var/www/opem/wordpress/cms     WordPress, servi à l'adresse /cms
#   /var/www/opem/wordpress/opem-prive  fichiers des candidatures (jamais servis)
# ==========================================================================

# http:// → https://opem-dz.com
server {
    listen 80;
    listen [::]:80;
    server_name opem-dz.com www.opem-dz.com;
    return 301 https://opem-dz.com$request_uri;
}

# https://www. → https://opem-dz.com (une seule adresse pour Google)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.opem-dz.com;

    ssl_certificate     /etc/letsencrypt/live/opem-dz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opem-dz.com/privkey.pem;

    return 301 https://opem-dz.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name opem-dz.com;

    ssl_certificate     /etc/letsencrypt/live/opem-dz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opem-dz.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root /var/www/opem/site/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Candidatures : CV et documents (le formulaire accepte jusqu'à 64 Mo en tout).
    client_max_body_size 64m;

    # Compression des textes (le JS et le CSS sont déjà minifiés).
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml text/plain;

    # ----- Redirections (comme vercel.json) -----

    # Adresses avec « .html » ou barre finale → adresse propre (hors WordPress).
    if ($request_uri ~ ^/(?!cms/)(.+)\.html(\?.*)?$) {
        return 301 /$1$2;
    }
    rewrite ^/(?!cms/)(.+)/$ /$1 permanent;

    location = /index {
        return 301 /;
    }
    location = /expertises {
        return 301 /nos-expertises;
    }
    location = /expertises/communication-d-entreprise {
        return 301 /expertises/communication-institutionnelle;
    }

    # ----- Le site React -----

    # JS et CSS : nom contenant une empreinte, donc gardés un an.
    location /assets/ {
        include snippets/opem-site-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Images et vidéos : nom fixe, revérifiées à chaque visite (304 si inchangées).
    location ~ ^/(images|videos)/ {
        include snippets/opem-site-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    # Pages : le fichier lui-même (robots.txt, sitemap.xml…), sa copie référencée
    # (le-cabinet.html servie à /le-cabinet), sinon l'application (elle affiche la page
    # demandée ou « Page introuvable »).
    location / {
        include snippets/opem-site-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html /index.html;
    }

    # ----- WordPress, à l'adresse /cms -----
    # Les visiteurs ne le voient jamais : seuls comptent l'administration (/cms/wp-admin),
    # l'API lue par le site (/cms/wp-json) et le lien de désinscription des éclairages.

    location ^~ /cms {
        root /var/www/opem/wordpress;
        index index.php;
        include snippets/opem-wp-headers.conf;

        # L'accueil de WordPress renvoie vers le site, sauf pour une désinscription.
        location = /cms/ {
            if ($arg_opem_desinscription = "") {
                return 302 /;
            }
            try_files $uri /cms/index.php?$args;
        }

        # Portes d'entrée inutiles et souvent attaquées.
        location = /cms/xmlrpc.php {
            deny all;
        }
        location ~ ^/cms/wp-content/uploads/.*\.php$ {
            deny all;
        }
        location ~ /\. {
            deny all;
        }

        location ~ \.php$ {
            # (fastcgi-php.conf vérifie déjà que le fichier existe.)
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
            fastcgi_read_timeout 120s; # envois de candidatures avec pièces jointes
        }

        try_files $uri $uri/ /cms/index.php?$args;
    }
}
